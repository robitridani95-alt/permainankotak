<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AR Blok Pinch</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
#cam,#gl,#hud{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover}
#hud{pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
#bar button{background:rgba(20,30,255,.85);border:0;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600}
#info{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:13px;opacity:.85;z-index:5;text-shadow:0 1px 3px #000}
#start{position:fixed;inset:0;background:#05060d;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center}
#start h1{font-size:26px}
#start p{opacity:.75;font-size:14px;max-width:320px;line-height:1.5}
#go{background:#1a2cff;color:#fff;border:0;padding:14px 34px;border-radius:16px;font-size:17px;font-weight:700}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="info">Memuat…</div>
<div id="bar" style="display:none">
  <button id="undo">Undo</button>
  <button id="clear">Hapus</button>
</div>
<div id="start">
  <h1>AR Blok Pinch</h1>
  <p>Cubit (jempol + telunjuk) lalu tarik di udara untuk memanjangkan blok. Lepas cubitan untuk menempatkan. Tarik ke arah lain untuk membelok. Di desktop: tahan klik mouse.</p>
  <button id="go">Mulai</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const $=id=>document.getElementById(id);
const video=$('cam'),glc=$('gl'),hud=$('hud'),hx=hud.getContext('2d'),info=$('info');
const CELL=0.06, FOV=60, HAND_M=0.09;
let W=innerWidth,H=innerHeight;

/* ---------- Three ---------- */
const renderer=new THREE.WebGLRenderer({canvas:glc,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(FOV,1,0.01,50);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(.4,1,.6);scene.add(dl);

function mkTex(fill,edge){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle=edge;g.fillRect(0,0,128,128);g.fillStyle=fill;g.fillRect(9,9,110,110);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
const geo=new THREE.BoxGeometry(CELL,CELL,CELL);
const matSolid=new THREE.MeshLambertMaterial({map:mkTex('#c9cee3','#1a2cff')});
const matPrev=new THREE.MeshBasicMaterial({map:mkTex('#2233ff','#3a4cff'),transparent:true,opacity:.6,depthWrite:false});

const built=new THREE.Group(),prev=new THREE.Group();scene.add(built,prev);
const cells=new Map();      // key -> mesh
const history=[];           // array of arrays of keys
let tail=null;              // [x,y,z]

const key=c=>c.join(','),
      toWorld=c=>new THREE.Vector3(c[0]*CELL,c[1]*CELL,c[2]*CELL),
      toGrid=v=>[Math.round(v.x/CELL),Math.round(v.y/CELL),Math.round(v.z/CELL)];

function addCell(c){
  const k=key(c);if(cells.has(k))return null;
  const m=new THREE.Mesh(geo,matSolid);m.position.copy(toWorld(c));built.add(m);cells.set(k,m);return k;
}
function commit(list){
  const ks=[];list.forEach(c=>{const k=addCell(c);if(k)ks.push(k)});
  if(ks.length)history.push(ks);
  if(list.length)tail=list[list.length-1];
}
function undo(){
  const ks=history.pop();if(!ks)return;
  ks.forEach(k=>{built.remove(cells.get(k));cells.delete(k)});
  const last=history[history.length-1];
  tail=last?last[last.length-1].split(',').map(Number):null;
}
$('undo').onclick=undo;
$('clear').onclick=()=>{while(history.length)undo();tail=null};

function showPrev(list){
  prev.clear();
  list.forEach(c=>{const m=new THREE.Mesh(geo,matPrev);m.scale.setScalar(1.02);m.position.copy(toWorld(c));prev.add(m)});
}

/* ---------- Drawing state ---------- */
let drawing=false,start=null,segs=[],curSeg=[];
function seg(a,b){ // sumbu dominan a->b
  const d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],ab=d.map(Math.abs);
  const ax=ab.indexOf(Math.max(...ab)),n=d[ax],dir=Math.sign(n)||1,out=[];
  for(let i=0;i<=Math.abs(n);i++){const c=a.slice();c[ax]+=i*dir;out.push(c)}
  const off=ab.filter((_,i)=>i!==ax);
  return {cells:out,off:Math.max(...off),end:out[out.length-1]};
}
function beginDraw(p){
  drawing=true;segs=[];
  const g=toGrid(p);
  start=(tail&&Math.hypot(g[0]-tail[0],g[1]-tail[1],g[2]-tail[2])<=4)?tail:g;
  curSeg=[];
}
function updateDraw(p){
  if(!drawing)return;
  const g=toGrid(p);let s=seg(start,g);
  if(s.off>=2&&s.cells.length>1){ // belok: kunci segmen, mulai dari ujung
    segs.push(s.cells);start=s.end;s=seg(start,g);
  }
  curSeg=s.cells;
  showPrev([...segs.flat(),...curSeg]);
}
function endDraw(){
  if(!drawing)return;drawing=false;
  const all=[...segs,curSeg];
  const flat=all.flat().filter((c,i,a)=>a.findIndex(x=>key(x)===key(c))===i);
  const fresh=flat.filter(c=>!cells.has(key(c)));
  if(fresh.length)commit(flat.filter(c=>!cells.has(key(c))));
  prev.clear();segs=[];curSeg=[];
}

/* ---------- Orientasi perangkat ---------- */
let orient=null,hasOri=false,yaw=0,pitch=0;
const q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),zz=new THREE.Vector3(0,0,1),eu=new THREE.Euler(),q0=new THREE.Quaternion();
addEventListener('deviceorientation',e=>{if(e.alpha!=null){orient=e;hasOri=true}});
function updateCam(){
  if(hasOri&&orient){
    const r=Math.PI/180,a=(orient.alpha||0)*r,b=(orient.beta||0)*r,g=(orient.gamma||0)*r,
          o=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*r;
    eu.set(b,a,-g,'YXZ');camera.quaternion.setFromEuler(eu);camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zz,-o));
  } else {camera.rotation.set(pitch,yaw,0,'YXZ')}
}

/* ---------- Proyeksi tangan -> dunia ---------- */
function vidToScreen(nx,ny){ // object-fit: cover
  const vw=video.videoWidth||W,vh=video.videoHeight||H,s=Math.max(W/vw,H/vh);
  return [(nx*vw*s)-(vw*s-W)/2,(ny*vh*s)-(vh*s-H)/2];
}
const fpx=()=>(H/2)/Math.tan(FOV*Math.PI/360);
function screenToWorld(sx,sy,d){
  const x=(sx-W/2)/fpx()*d,y=-(sy-H/2)/fpx()*d;
  return new THREE.Vector3(x,y,-d).applyQuaternion(camera.quaternion).add(camera.position);
}

/* ---------- MediaPipe ---------- */
let pinched=false,smooth=null,lastRes=null;
function onHands(res){
  lastRes=res;
  const lm=res.multiHandLandmarks&&res.multiHandLandmarks[0];
  if(!lm){if(pinched){pinched=false;endDraw()}smooth=null;return}
  const vw=video.videoWidth,vh=video.videoHeight;
  const P=i=>vidToScreen(lm[i].x,lm[i].y);
  const sc=Math.hypot((lm[0].x-lm[9].x)*vw,(lm[0].y-lm[9].y)*vh); // px video
  const sPx=sc*Math.max(W/vw,H/vh);
  const d=Math.min(1.3,Math.max(.25,fpx()*HAND_M/Math.max(sPx,1)));
  const t=P(4),i=P(8),pd=Math.hypot(t[0]-i[0],t[1]-i[1]);
  const on=pinched?pd<sPx*.55:pd<sPx*.32;
  const mid=[(t[0]+i[0])/2,(t[1]+i[1])/2];
  const w=screenToWorld(mid[0],mid[1],d);
  smooth=smooth?smooth.lerp(w,.45):w.clone();
  if(on&&!pinched){pinched=true;beginDraw(smooth)}
  else if(!on&&pinched){pinched=false;endDraw()}
  if(pinched)updateDraw(smooth);
}

/* ---------- Mouse/touch fallback ---------- */
let mouseDown=false;
function ptrWorld(e){return screenToWorld(e.clientX,e.clientY,.6)}
glc.addEventListener('pointerdown',e=>{if(e.target!==glc)return;mouseDown=true;beginDraw(ptrWorld(e))});
addEventListener('pointermove',e=>{if(mouseDown)updateDraw(ptrWorld(e))});
addEventListener('pointerup',()=>{if(mouseDown){mouseDown=false;endDraw()}});
addEventListener('keydown',e=>{
  if(hasOri)return;const s=.06;
  if(e.key==='ArrowLeft')yaw+=s;if(e.key==='ArrowRight')yaw-=s;
  if(e.key==='ArrowUp')pitch+=s;if(e.key==='ArrowDown')pitch-=s;
});

/* ---------- HUD ---------- */
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHud(){
  hx.clearRect(0,0,W,H);
  const lm=lastRes&&lastRes.multiHandLandmarks&&lastRes.multiHandLandmarks[0];
  if(!lm)return;
  hx.strokeStyle='rgba(255,255,255,.55)';hx.lineWidth=1.5;
  hx.beginPath();CONN.forEach(([a,b])=>{const p=vidToScreen(lm[a].x,lm[a].y),q=vidToScreen(lm[b].x,lm[b].y);hx.moveTo(p[0],p[1]);hx.lineTo(q[0],q[1])});hx.stroke();
  const t=vidToScreen(lm[4].x,lm[4].y),i=vidToScreen(lm[8].x,lm[8].y);
  hx.beginPath();hx.arc((t[0]+i[0])/2,(t[1]+i[1])/2,pinched?14:9,0,7);
  hx.strokeStyle=pinched?'#3a4cff':'rgba(255,255,255,.8)';hx.lineWidth=3;hx.stroke();
}

/* ---------- Loop ---------- */
function resize(){
  W=innerWidth;H=innerHeight;
  for(const c of [hud]){c.width=W;c.height=H}
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
let hands,busy=false;
function loop(){
  requestAnimationFrame(loop);
  updateCam();renderer.render(scene,camera);drawHud();
  if(hands&&!busy&&video.readyState>=2){busy=true;hands.send({image:video}).then(()=>busy=false).catch(()=>busy=false)}
}

$('go').onclick=async()=>{
  try{
    if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
  }catch(e){}
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=st;await video.play();
  }catch(e){info.textContent='Kamera ditolak/tidak ada. Mode mouse aktif.'}
  $('start').style.display='none';$('bar').style.display='flex';
  info.textContent='Memuat hand-tracking…';
  try{
    hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(r=>{if(info.textContent.startsWith('Memuat'))info.textContent='Cubit & tarik untuk membangun';onHands(r)});
  }catch(e){info.textContent='Hand-tracking gagal dimuat. Pakai mouse.'}
  loop();
};
</script>
</body>
</html>
