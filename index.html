<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AR Blok Pinch</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
#cam,#gl,#hud{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover}
#hud{pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
#bar button{background:rgba(20,30,255,.85);border:0;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600}
#info{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:13px;opacity:.85;z-index:5;text-shadow:0 1px 3px #000}
#start{position:fixed;inset:0;background:#05060d;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center}
#start h1{font-size:26px}
#start p{opacity:.75;font-size:14px;max-width:320px;line-height:1.5}
#go{background:#1a2cff;color:#fff;border:0;padding:14px 34px;border-radius:16px;font-size:17px;font-weight:700}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="info">Memuat…</div>
<div id="bar" style="display:none">
  <button id="undo">Undo</button>
  <button id="clear">Hapus</button>
</div>
<div id="start">
  <h1>AR Blok Pinch</h1>
  <p>Cubit (jempol + telunjuk) di dekat sisi kubus, lalu tarik menjauh untuk memanjangkan blok. Cubit di tempat lain tidak memunculkan apa pun. Lepas cubitan untuk menempatkan. Lepas lalu cubit-tarik lagi ke arah lain untuk membelok. Di desktop: tahan klik mouse.</p>
  <button id="go">Mulai</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const $=id=>document.getElementById(id);
const video=$('cam'),glc=$('gl'),hud=$('hud'),hx=hud.getContext('2d'),info=$('info');
const CELL=0.06, FOV=60, HAND_M=0.09;
let W=innerWidth,H=innerHeight;

/* ---------- Three ---------- */
const renderer=new THREE.WebGLRenderer({canvas:glc,alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(FOV,1,0.01,50);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(.4,1,.6);scene.add(dl);

function mkTex(fill,edge){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle=edge;g.fillRect(0,0,128,128);g.fillStyle=fill;g.fillRect(12,12,104,104);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
const geo=new THREE.BoxGeometry(CELL,CELL,CELL);
const matSolid=new THREE.MeshLambertMaterial({map:mkTex('#c9cee3','#1a2cff')});
const matPrev=new THREE.MeshBasicMaterial({map:mkTex('#2233ff','#3a4cff'),transparent:true,opacity:.6,depthWrite:false});

const matPrevBody=new THREE.MeshBasicMaterial({map:mkTex('#1c2cff','#7b8dff'),transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false});
const headTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.strokeStyle='#2236ff';g.lineWidth=20;g.strokeRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const matHead=new THREE.MeshBasicMaterial({map:headTex,transparent:true,side:THREE.DoubleSide,depthWrite:false});
const built=new THREE.Group(),prev=new THREE.Group();scene.add(built,prev);
const cells=new Map();      // key -> mesh
const history=[];           // array of arrays of keys
let tail=null;              // [x,y,z]

const key=c=>c.join(','),
      toWorld=c=>new THREE.Vector3(c[0]*CELL,c[1]*CELL,c[2]*CELL),
      toGrid=v=>[Math.round(v.x/CELL),Math.round(v.y/CELL),Math.round(v.z/CELL)];

const pops=[];
function addCell(c,delay=0){
  const k=key(c);if(cells.has(k))return null;
  const m=new THREE.Mesh(geo,matSolid);m.position.copy(toWorld(c));m.scale.setScalar(.88);
  built.add(m);cells.set(k,m);pops.push({m,t0:performance.now()+delay});return k;
}
function stepPops(now){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i],u=Math.min(Math.max((now-p.t0)/180,0),1),e=1-Math.pow(1-u,3),o=1+.12*Math.sin(u*Math.PI);
    p.m.scale.setScalar(.88+.12*e+.05*Math.sin(u*Math.PI));
    if(u>=1){p.m.scale.setScalar(1);pops.splice(i,1)}
  }
}
function commit(list){
  const ks=[];list.forEach((c,i)=>{const k=addCell(c,i*5);if(k)ks.push(k)});
  if(ks.length)history.push(ks);
  if(list.length)tail=list[list.length-1];
}
function undo(){
  const ks=history.pop();if(!ks)return;
  ks.forEach(k=>{built.remove(cells.get(k));cells.delete(k)});
  const last=history[history.length-1];
  tail=last?last[last.length-1].split(',').map(Number):(startCell?startCell.slice():null);
}
$('undo').onclick=undo;
let startCell=null;
function placeStart(){
  if(cells.size)return;
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(.5).add(camera.position);
  startCell=toGrid(f);addCell(startCell,0);tail=startCell.slice();
}
function removeStart(){
  if(!startCell)return;const k=key(startCell);
  if(cells.has(k)){built.remove(cells.get(k));cells.delete(k)}
  startCell=null;if(!history.length)tail=null;
}
$('clear').onclick=()=>{while(history.length)undo();removeStart();tail=null;placeStart()};

const pool=[];let prevKey='',headM=null;
const pv={on:false,ax:0,dir:1,n:0,disp:0,origin:[0,0,0],incl:false};
function animPrev(dt){
  if(!pv.on||!drawing)return;
  pv.disp+=(pv.n-pv.disp)*(1-Math.exp(-dt/.05));
  if(Math.abs(pv.n-pv.disp)<.003)pv.disp=pv.n;
  const L=pv.disp,N=Math.ceil(L-1e-3);
  prev.clear();
  const base=toWorld(pv.origin),step=CELL*pv.dir;
  if(pv.incl&&N>0){const o=pool[0]||(pool[0]=new THREE.Mesh(geo,matPrevBody));o.scale.set(1.01,1.01,1.01);o.renderOrder=1;o.position.copy(base);prev.add(o)}
  for(let i=1;i<=N;i++){
    const f=Math.min(1,L-(i-1)),head=i===N;
    const m=head?(headM||(headM=new THREE.Mesh(geo,matHead))):(pool[i]||(pool[i]=new THREE.Mesh(geo,matPrevBody)));
    m.renderOrder=head?2:1;
    m.scale.set(1.01,1.01,1.01);m.scale.setComponent(pv.ax,Math.max(f,.02));
    m.position.copy(base);m.position.setComponent(pv.ax,base.getComponent(pv.ax)+step*((i-.5)+f/2));
    prev.add(m);
  }
}
function showPrev(list){
  const k=list.map(key).join('|');
  if(k===prevKey&&prev.children.length)return;
  prevKey=k;prev.clear();
  list.forEach((c,i)=>{
    const head=i===list.length-1;
    const m=head?(headM||(headM=new THREE.Mesh(geo,matHead))):(pool[i]||(pool[i]=new THREE.Mesh(geo,matPrevBody)));
    m.scale.setScalar(head?1.04:1);m.renderOrder=head?2:1;m.position.copy(toWorld(c));prev.add(m);
  });
}

/* ---------- Drawing state ---------- */
let drawing=false,segs=[],curSeg=[],lastG=null,axLock=null;
let armed=false,dOff=0;
function snapH(v){
  const f=[v.x/CELL,v.y/CELL,v.z/CELL];
  if(!lastG)lastG=f.map(Math.round);
  for(let i=0;i<3;i++)if(Math.abs(f[i]-lastG[i])>.65)lastG[i]=Math.round(f[i]);
  return lastG.slice();
}
function beginDraw(p){
  drawing=true;segs=[];curSeg=[];lastG=null;axLock=null;
  armed=false;dOff=0;
  if(tail){
    // cubitan hanya "aktif" kalau dimulai dekat sisi kubus ujung (seperti di video)
    const iq=camera.quaternion.clone().invert();
    const a=p.clone().sub(camera.position).applyQuaternion(iq),
          b=toWorld(tail).sub(camera.position).applyQuaternion(iq);
    armed=Math.hypot(a.x-b.x,a.y-b.y)<=CELL*2.8&&Math.abs(a.z-b.z)<=.4;
    dOff=a.z-b.z;lastG=null;   // samakan kedalaman tangan dengan kedalaman kubus
  }
}
function chainDraw(p){
  if(!armed||!tail)return;
  const g=snapH(p),d=[g[0]-tail[0],g[1]-tail[1],g[2]-tail[2]],ab=d.map(Math.abs);
  let n=0,dir=pv.dir,ax=pv.ax;
  if(Math.max(...ab)>0){
    ax=ab.indexOf(Math.max(...ab));
    if(axLock!==null&&ab[axLock]*1.35>=ab[ax])ax=axLock;else axLock=ax;
    n=Math.max(-30,Math.min(30,d[ax]));dir=Math.sign(n)||1;n=Math.abs(n);
  }else axLock=null;
  const out=[];
  for(let i=1;i<=n;i++){const c=tail.slice();c[ax]+=i*dir;out.push(c)}
  segs=[];curSeg=out;
  if(n>0&&(!pv.on||pv.ax!==ax||pv.dir!==dir))pv.disp=0;
  pv.on=true;if(n>0){pv.ax=ax;pv.dir=dir}
  pv.n=n;pv.origin=tail.slice();pv.incl=false;
}
function updateDraw(p){
  if(drawing)chainDraw(p);
}
function endDraw(){
  if(!drawing)return;drawing=false;
  const all=[...segs,curSeg];
  const flat=all.flat().filter((c,i,a)=>a.findIndex(x=>key(x)===key(c))===i);
  const fresh=flat.filter(c=>!cells.has(key(c)));
  if(fresh.length)commit(flat.filter(c=>!cells.has(key(c))));
  prev.clear();segs=[];curSeg=[];pv.on=false;pv.disp=0;
}

/* ---------- Orientasi perangkat ---------- */
let orient=null,hasOri=false,yaw=0,pitch=0;
const q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),zz=new THREE.Vector3(0,0,1),eu=new THREE.Euler(),q0=new THREE.Quaternion();
addEventListener('deviceorientation',e=>{if(e.alpha!=null){orient=e;hasOri=true}});
const tq=new THREE.Quaternion();
function updateCam(){
  if(hasOri&&orient){
    const r=Math.PI/180,a=(orient.alpha||0)*r,b=(orient.beta||0)*r,g=(orient.gamma||0)*r,
          o=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*r;
    eu.set(b,a,-g,'YXZ');tq.setFromEuler(eu);tq.multiply(q1);
    tq.multiply(q0.setFromAxisAngle(zz,-o));camera.quaternion.slerp(tq,1-Math.exp(-FDT/.03));
  } else {camera.rotation.set(pitch,yaw,0,'YXZ')}
}

/* ---------- Proyeksi tangan -> dunia ---------- */
function vidToScreen(nx,ny){ // object-fit: cover
  const vw=video.videoWidth||W,vh=video.videoHeight||H,s=Math.max(W/vw,H/vh);
  return [(nx*vw*s)-(vw*s-W)/2,(ny*vh*s)-(vh*s-H)/2];
}
const fpx=()=>(H/2)/Math.tan(FOV*Math.PI/360);
function screenToWorld(sx,sy,d){
  const x=(sx-W/2)/fpx()*d,y=-(sy-H/2)/fpx()*d;
  return new THREE.Vector3(x,y,-d).applyQuaternion(camera.quaternion).add(camera.position);
}

/* ---------- MediaPipe ---------- */
class OE{constructor(mc,b){this.mc=mc;this.b=b;this.x=null;this.dx=0;this.t=0}
  a(c,dt){const r=2*Math.PI*c*dt;return r/(r+1)}
  f(v,t){if(this.x===null){this.x=v;this.t=t;return v}
    const dt=Math.max((t-this.t)/1000,1e-3);this.t=t;
    this.dx+=this.a(1,dt)*((v-this.x)/dt-this.dx);
    this.x+=this.a(this.mc+this.b*Math.abs(this.dx),dt)*(v-this.x);return this.x}
  reset(){this.x=null;this.dx=0}}
const fX=new OE(1.6,.04),fY=new OE(1.6,.04),fS=new OE(1,.05),fR=new OE(5,0),fD=new OE(.9,2);
let pinched=false,lastRes=null,lost=0,hT=null,hS=null,pc=0;
function onHands(res){
  lastRes=res;const now=performance.now();
  const lm=res.multiHandLandmarks&&res.multiHandLandmarks[0];
  if(!lm){
    if(++lost>8){if(pinched){pinched=false;endDraw()}hT=hS=null;[fX,fY,fS,fR,fD].forEach(f=>f.reset());pc=0}
    return;
  }
  lost=0;
  const vw=video.videoWidth,vh=video.videoHeight;
  const P=i=>vidToScreen(lm[i].x,lm[i].y);
  const sc=Math.hypot((lm[0].x-lm[9].x)*vw,(lm[0].y-lm[9].y)*vh);
  const sPx=fS.f(sc*Math.max(W/vw,H/vh),now);
  const t=P(4),i=P(8);
  const r=fR.f(Math.hypot(t[0]-i[0],t[1]-i[1])/Math.max(sPx,1),now);
  const want=pinched?r<.48:r<.26;
  pc=want!==pinched?pc+1:0;
  const on=pc>=(pinched?2:1)?want:pinched;
  const x=fX.f((t[0]+i[0])/2,now),y=fY.f((t[1]+i[1])/2,now);
  const d=fD.f(Math.min(1.3,Math.max(.25,fpx()*HAND_M/Math.max(sPx,1))),now);
  let vx=0,vy=0;
  if(hT){
    const dts=Math.max((now-hT.t)/1000,.008);
    vx=hT.vx*.4+((x-hT.x)/dts)*.6;vy=hT.vy*.4+((y-hT.y)/dts)*.6;
    const sp=Math.hypot(vx,vy);
    if(sp<18)vx=vy=0;else if(sp>2500){vx*=2500/sp;vy*=2500/sp}
  }
  hT={x,y,d,r,vx,vy,t:now};if(!hS)hS={x,y,d};
  if(on&&!pinched){pinched=true;hS={x,y,d};beginDraw(screenToWorld(x,y,d))}
  else if(!on&&pinched){pinched=false;endDraw()}
}
function stepHand(dt,now){
  if(!hT||!hS)return;
  const age=Math.min((now-hT.t)/1000,.07)+.02;          // tebak posisi antar deteksi
  const tx=hT.x+hT.vx*age,ty=hT.y+hT.vy*age;
  const dist=Math.hypot(tx-hS.x,ty-hS.y);
  const k=1-Math.exp(-dt/(.07-.045*Math.min(dist/40,1))); // pelan = halus, cepat = responsif
  hS.x+=(tx-hS.x)*k;hS.y+=(ty-hS.y)*k;
  hS.d+=(hT.d-hS.d)*(1-Math.exp(-dt/.09));
  if(pinched&&hT.r<.42)updateDraw(screenToWorld(hS.x,hS.y,Math.max(.1,hS.d+dOff)));
}

/* ---------- Mouse/touch fallback ---------- */
let mouseDown=false;
function ptrWorld(e){return screenToWorld(e.clientX,e.clientY,.5)}
glc.addEventListener('pointerdown',e=>{if(e.target!==glc)return;mouseDown=true;beginDraw(ptrWorld(e))});
addEventListener('pointermove',e=>{if(mouseDown)updateDraw(ptrWorld(e))});
addEventListener('pointerup',()=>{if(mouseDown){mouseDown=false;endDraw()}});
addEventListener('keydown',e=>{
  if(hasOri)return;const s=.06;
  if(e.key==='ArrowLeft')yaw+=s;if(e.key==='ArrowRight')yaw-=s;
  if(e.key==='ArrowUp')pitch+=s;if(e.key==='ArrowDown')pitch-=s;
});

/* ---------- HUD ---------- */
const hl=[];let FDT=.016;
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHud(){
  hx.clearRect(0,0,W,H);
  const lm=lastRes&&lastRes.multiHandLandmarks&&lastRes.multiHandLandmarks[0];
  if(!lm){hl.length=0;return}
  hx.strokeStyle='rgba(255,255,255,.55)';hx.lineWidth=1.5;
  const kk=1-Math.exp(-FDT/.035);
  const sl=lm.map((q,i)=>{const v=vidToScreen(q.x,q.y),h=hl[i]||(hl[i]=v.slice());h[0]+=(v[0]-h[0])*kk;h[1]+=(v[1]-h[1])*kk;return h});
  const GH=[[1,2],[2,3],[3,4],[5,6],[6,7],[7,8]];
  hx.lineCap='round';
  [[11,'rgba(255,255,255,.16)'],[1.5,'rgba(255,255,255,.55)']].forEach(([w,c])=>{
    hx.lineWidth=w;hx.strokeStyle=c;hx.beginPath();
    GH.forEach(([a,b])=>{hx.moveTo(sl[a][0],sl[a][1]);hx.lineTo(sl[b][0],sl[b][1])});hx.stroke();
  });
  const t=vidToScreen(lm[4].x,lm[4].y),i=vidToScreen(lm[8].x,lm[8].y);
  const cx=hS?hS.x:(t[0]+i[0])/2,cy=hS?hS.y:(t[1]+i[1])/2;

}

/* ---------- Loop ---------- */
function resize(){
  W=innerWidth;H=innerHeight;
  for(const c of [hud]){c.width=W;c.height=H}
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
const dc=document.createElement('canvas'),dctx=dc.getContext('2d');
let hands,busy=false,lastVT=-1;
let lastT=performance.now();
function loop(now=performance.now()){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,.1);lastT=now;FDT=dt;
  updateCam();stepHand(dt,now);animPrev(dt);stepPops(now);renderer.render(scene,camera);drawHud();
  if(hands&&!busy&&video.readyState>=2&&video.currentTime!==lastVT){lastVT=video.currentTime;busy=true;
    const w=480,h=Math.round(w*video.videoHeight/video.videoWidth)||270;
    if(dc.width!==w||dc.height!==h){dc.width=w;dc.height=h}
    dctx.drawImage(video,0,0,w,h);
    hands.send({image:dc}).then(()=>busy=false).catch(()=>busy=false)}
}

$('go').onclick=async()=>{
  try{
    if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
  }catch(e){}
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540},frameRate:{ideal:30}},audio:false});
    video.srcObject=st;await video.play();
  }catch(e){info.textContent='Kamera ditolak/tidak ada. Mode mouse aktif.'}
  $('start').style.display='none';$('bar').style.display='flex';
  info.textContent='Memuat hand-tracking…';
  try{
    hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:/Mobi|Android|iPhone/i.test(navigator.userAgent)?0:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(r=>{if(info.textContent.startsWith('Memuat'))info.textContent='Cubit dekat kubus lalu tarik';onHands(r)});
  }catch(e){info.textContent='Hand-tracking gagal dimuat. Pakai mouse.'}
  loop();setTimeout(placeStart,900);
};
</script>
</body>
</html>
