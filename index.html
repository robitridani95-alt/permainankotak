<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Blok</title>
<style>
html,body{margin:0;height:100%;background:#0a0a0c;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
#cam.on{opacity:1}
#gl,#hand{position:fixed;inset:0;width:100%;height:100%}
#hand{pointer-events:none}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px;text-align:center;pointer-events:none}
#msg{display:inline-block;background:rgba(0,0,0,.55);padding:7px 14px;border-radius:999px;font-size:13px;max-width:92%}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:14px;color:#fff;background:rgba(0,0,0,.6);border:1.5px solid #2b3dff;border-radius:10px;padding:9px 14px;cursor:pointer}
button.a{background:#2b3dff}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:17px;padding:14px 22px;background:#2b3dff}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="gl"></canvas>
<canvas id="hand"></canvas>
<div id="top"><span id="msg">Mouse/sentuh: tarik untuk membuat balok. Roda mouse mengatur kedalaman.</span></div>
<button id="start">Aktifkan kamera &amp; hand tracking</button>
<div id="bar">
  <button id="mode">Mode: Bangun</button>
  <button id="flip" style="display:none">Ganti kamera</button>
  <button id="undo">Urungkan</button>
  <button id="clear">Hapus semua</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const $=id=>document.getElementById(id);
const S=0.4, D0=3.0, MAXN=48;
const damp=(rate,dt)=>1-Math.exp(-rate*dt);

/* ---------- One Euro filter: halus saat pelan, responsif saat cepat ---------- */
class OneEuro{
  constructor(minCut=1,beta=.01,dcut=1){this.minCut=minCut;this.beta=beta;this.dcut=dcut;this.t=null;}
  a(c,dt){const tau=1/(2*Math.PI*c);return 1/(1+tau/dt);}
  f(x,t){
    if(this.t==null){this.t=t;this.x=x;this.dx=0;return x;}
    const dt=Math.max((t-this.t)/1000,1e-3);
    this.dx+=this.a(this.dcut,dt)*((x-this.x)/dt-this.dx);
    this.x+=this.a(this.minCut+this.beta*Math.abs(this.dx),dt)*(x-this.x);
    this.t=t;return this.x;
  }
  reset(){this.t=null;}
}

/* ---------- three.js ---------- */
const gl=$('gl');
const renderer=new THREE.WebGLRenderer({canvas:gl,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,0.05,60);
scene.add(new THREE.AmbientLight(0xffffff,.86));
const dl=new THREE.DirectionalLight(0xffffff,.4);dl.position.set(1,2.4,1.2);scene.add(dl);
const world=new THREE.Group();world.position.set(0,-0.2,-D0);scene.add(world);

function faceTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#b8c3e1';g.fillRect(0,0,256,256);
  g.strokeStyle='#2b3dff';g.lineWidth=40;g.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t;
}
const cubeGeo=new THREE.BoxGeometry(S,S,S);
const edgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(S,S,S));
const cubeMat=new THREE.MeshLambertMaterial({map:faceTex()});

const cells=new Map(), history=[], popping=[];
const key=(i,j,k)=>i+','+j+','+k;
function addCell(i,j,k){
  const kk=key(i,j,k);if(cells.has(kk))return false;
  const m=new THREE.Mesh(cubeGeo,cubeMat);
  m.position.set(i*S,j*S,k*S);m.scale.setScalar(.6);world.add(m);cells.set(kk,m);
  popping.push({m,t0:performance.now()});return true;
}

/* pratinjau */
const pv=new THREE.Group();pv.visible=false;world.add(pv);
const pvBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),
  new THREE.MeshBasicMaterial({color:0x1a2cff,transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false}));
const pvDiv=new THREE.Group();
const divMat=new THREE.LineBasicMaterial({color:0x7d8cff,transparent:true,opacity:.55});
const pool=[];for(let i=0;i<MAXN;i++){const l=new THREE.LineSegments(edgeGeo,divMat);l.visible=false;pvDiv.add(l);pool.push(l);}
const cap=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0xe9eeff}));
pv.add(pvBox,pvDiv,cap);
const ghost=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0xe9eeff,transparent:true,opacity:.85}));
ghost.visible=false;world.add(ghost);

const P={on:false,start:[0,0,0],dir:new THREE.Vector3(1,0,0),dkey:'',len:1,tlen:1};
function setPreview(a,b){
  if(!a){P.on=false;pv.visible=false;return;}
  let ax=-1;for(let i=0;i<3;i++)if(a[i]!==b[i])ax=i;
  const d=new THREE.Vector3(1,0,0);let n=1;
  if(ax>=0){d.set(0,0,0).setComponent(ax,Math.sign(b[ax]-a[ax]));n=Math.abs(b[ax]-a[ax])+1;}
  const dk=ax+':'+d.getComponent(Math.max(ax,0));
  if(!P.on||dk!==P.dkey||a.join()!==P.start.join()){P.len=1;}
  if(!P.on){P.len=1;}
  P.on=true;P.start=a;P.dir.copy(d);P.dkey=dk;P.tlen=n;pv.visible=true;
}
function animPreview(dt){
  if(!P.on)return;
  P.len+=(P.tlen-P.len)*damp(26,dt);
  const d=P.dir,L=P.len,st=P.start;
  pvBox.scale.set(d.x?L*S:S,d.y?L*S:S,d.z?L*S:S);
  const h=(L-1)/2;
  pvBox.position.set((st[0]+d.x*h)*S,(st[1]+d.y*h)*S,(st[2]+d.z*h)*S);
  cap.position.set((st[0]+d.x*(L-1))*S,(st[1]+d.y*(L-1))*S,(st[2]+d.z*(L-1))*S);
  for(let i=0;i<MAXN;i++){
    const l=pool[i],on=i<L-.25;l.visible=on;
    if(on)l.position.set((st[0]+d.x*i)*S,(st[1]+d.y*i)*S,(st[2]+d.z*i)*S);
  }
}

function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  const r=Math.min(devicePixelRatio,2);hc.width=w*r;hc.height=h*r;
}

function toLocal(px,py,depth){
  const v=new THREE.Vector3(px/innerWidth*2-1,-(py/innerHeight*2-1),.5).unproject(camera);
  const dir=v.sub(camera.position).normalize();
  const p=camera.position.clone().add(dir.multiplyScalar(depth/-dir.z));
  return world.worldToLocal(p);
}

/* ---------- logika bangun ---------- */
let mode='build', drag=null, cur=null;
const tgt={x:0,y:0,d:D0,down:false,seen:false};   // target dari input
const ptr={x:0,y:0,d:D0,down:false,seen:false};   // posisi tampilan (dihaluskan)

/* snap ke grid dengan histeresis supaya tidak berkedip di batas sel */
function hyst(p){
  const v=[p.x/S,p.y/S,p.z/S];
  if(!cur)cur=v.map(Math.round);
  else for(let i=0;i<3;i++)if(Math.abs(v[i]-cur[i])>.5+.2)cur[i]=Math.round(v[i]);
  return cur.slice();
}
function lineCells(a,b){
  const out=[];let ax=-1;
  for(let i=0;i<3;i++)if(a[i]!==b[i])ax=i;
  if(ax<0)return [a.slice()];
  const sg=Math.sign(b[ax]-a[ax]);
  for(let s=0;s<=Math.abs(b[ax]-a[ax]);s++){const c=a.slice();c[ax]+=s*sg;out.push(c);}
  return out;
}
function constrain(c){
  const d=[c[0]-drag.start[0],c[1]-drag.start[1],c[2]-drag.start[2]];
  if(drag.axis>=0&&d[drag.axis]===0)drag.axis=-1;
  if(drag.axis<0){
    let best=-1,bv=0;
    for(let i=0;i<3;i++)if(Math.abs(d[i])>bv){bv=Math.abs(d[i]);best=i;}
    if(best>=0)drag.axis=best;
  }
  const e=drag.start.slice();
  if(drag.axis>=0)e[drag.axis]+=Math.max(-(MAXN-1),Math.min(MAXN-1,d[drag.axis]));
  return e;
}
function commit(){
  const batch=[];
  for(const [i,j,k] of lineCells(drag.start,drag.last))if(addCell(i,j,k))batch.push(key(i,j,k));
  if(batch.length)history.push(batch);
  drag=null;setPreview(null);
}
const gv=new THREE.Vector3();
function stepBuild(dt){
  if(tgt.seen){
    if(!ptr.seen){ptr.x=tgt.x;ptr.y=tgt.y;ptr.d=tgt.d;}
    else{const k=damp(34,dt);ptr.x+=(tgt.x-ptr.x)*k;ptr.y+=(tgt.y-ptr.y)*k;ptr.d+=(tgt.d-ptr.d)*damp(14,dt);}
  }
  ptr.seen=tgt.seen;ptr.down=tgt.down;
  if(!ptr.seen){if(drag)commit();ghost.visible=false;cur=null;return;}
  const c=hyst(toLocal(ptr.x,ptr.y,ptr.d));
  if(ptr.down&&!drag)drag={start:c,axis:-1,last:c};
  if(drag&&ptr.down){
    drag.last=constrain(c);ghost.visible=false;setPreview(drag.start,drag.last);
  }else if(drag){
    commit();
  }else{
    gv.set(c[0]*S,c[1]*S,c[2]*S);
    if(!ghost.visible)ghost.position.copy(gv);else ghost.position.lerp(gv,damp(24,dt));
    ghost.visible=true;
  }
}

/* putar dengan inersia */
const rv={x:0,y:0};let lastRot=0;
function rotateBy(dx,dy){
  const n=performance.now(),el=Math.max(8,n-lastRot)/1000;lastRot=n;
  world.rotation.y+=dx*.008;
  world.rotation.x=Math.max(-1.4,Math.min(1.4,world.rotation.x+dy*.008));
  rv.y=rv.y*.5+(dx*.008/el)*.5;rv.x=rv.x*.5+(dy*.008/el)*.5;
}
function inertia(dt){
  if(performance.now()-lastRot<90)return;
  world.rotation.y+=rv.y*dt;
  world.rotation.x=Math.max(-1.4,Math.min(1.4,world.rotation.x+rv.x*dt));
  const f=Math.exp(-3.2*dt);rv.x*=f;rv.y*=f;
  if(Math.abs(rv.x)<.002)rv.x=0;if(Math.abs(rv.y)<.002)rv.y=0;
}
function animPop(now){
  for(let i=popping.length-1;i>=0;i--){
    const {m,t0}=popping[i],p=Math.min(1,(now-t0)/170),e=1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2);
    m.scale.setScalar(.6+.4*e);if(p>=1){m.scale.setScalar(1);popping.splice(i,1);}
  }
}

$('undo').onclick=()=>{const b=history.pop();if(!b)return;for(const k of b){const m=cells.get(k);world.remove(m);cells.delete(k);const i=popping.findIndex(o=>o.m===m);if(i>=0)popping.splice(i,1);}};
$('clear').onclick=()=>{for(const m of cells.values())world.remove(m);cells.clear();history.length=0;popping.length=0;};
$('mode').onclick=()=>{mode=mode==='build'?'rotate':'build';
  $('mode').textContent='Mode: '+(mode==='build'?'Bangun':'Putar');$('mode').classList.toggle('a',mode==='rotate');};

/* mouse / sentuh */
let last=null,handsOn=false;
gl.addEventListener('pointerdown',e=>{
  if(handsOn)return;gl.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};rv.x=rv.y=0;
  if(mode==='build'){tgt.x=e.clientX;tgt.y=e.clientY;tgt.down=true;tgt.seen=true;}
});
gl.addEventListener('pointermove',e=>{
  if(handsOn)return;
  if(mode==='build'){tgt.x=e.clientX;tgt.y=e.clientY;tgt.seen=true;}
  else if(last&&e.buttons)rotateBy(e.clientX-last.x,e.clientY-last.y);
  last={x:e.clientX,y:e.clientY};
});
gl.addEventListener('pointerup',()=>{if(!handsOn)tgt.down=false;last=null;});
gl.addEventListener('wheel',e=>{if(!handsOn){tgt.d=Math.max(1.4,Math.min(7,tgt.d+e.deltaY*.003));e.preventDefault();}},{passive:false});
gl.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- hand tracking ---------- */
const video=$('cam'),hc=$('hand'),hx=hc.getContext('2d');
addEventListener('resize',resize);resize();
let mirror=true,facing='user',hands=null,stream=null;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mk=()=>({fx:new OneEuro(1.2,.012),fy:new OneEuro(1.2,.012),fd:new OneEuro(.8,.6),q:.6,pinch:false,rp:null,seen:false,x:0,y:0,d:D0});
const H=[mk(),mk()];
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let tgtLm=[],dispLm=[];

function toScreen(l){
  const vw=video.videoWidth,vh=video.videoHeight,W=innerWidth,Hh=innerHeight;
  const sc=Math.max(W/vw,Hh/vh), lx=mirror?1-l.x:l.x;
  return {x:lx*vw*sc-(vw*sc-W)/2, y:l.y*vh*sc-(vh*sc-Hh)/2};
}
function drawHands(dt){
  const r=Math.min(devicePixelRatio,2);
  hx.setTransform(r,0,0,r,0,0);hx.clearRect(0,0,innerWidth,innerHeight);
  if(!video.videoWidth)return;
  hx.lineCap='round';hx.lineJoin='round';
  const k=damp(30,dt);
  tgtLm.forEach((lm,n)=>{
    const t=lm.map(toScreen);
    if(!dispLm[n])dispLm[n]=t.map(p=>({x:p.x,y:p.y}));
    const p=dispLm[n];
    for(let i=0;i<21;i++){p[i].x+=(t[i].x-p[i].x)*k;p[i].y+=(t[i].y-p[i].y)*k;}
    const sz=Math.hypot(p[0].x-p[9].x,p[0].y-p[9].y);
    for(const [w,col] of [[sz*.34,'rgba(255,255,255,.10)'],[sz*.22,'rgba(255,255,255,.10)'],[1.6,'rgba(255,255,255,.75)']]){
      hx.lineWidth=w;hx.strokeStyle=col;hx.beginPath();
      for(const [a,b] of CONN){hx.moveTo(p[a].x,p[a].y);hx.lineTo(p[b].x,p[b].y);}
      hx.stroke();
    }
  });
  dispLm.length=tgtLm.length;
}
function onHands(res){
  const hs=res.multiHandLandmarks||[];handsOn=true;const t=performance.now();
  tgtLm=hs.slice(0,2);
  hs.slice(0,2).forEach((lm,n)=>{
    const s=H[n],size=dist(lm[0],lm[9])||.2;
    const sc=toScreen({x:(lm[4].x+lm[8].x)/2,y:(lm[4].y+lm[8].y)/2});
    s.x=s.fx.f(sc.x,t);s.y=s.fy.f(sc.y,t);
    s.d=s.fd.f(Math.max(1.5,Math.min(5.5,.62/size)),t);s.seen=true;
    s.q+=(dist(lm[4],lm[8])/size-s.q)*.55;
    s.pinch=s.pinch?s.q<.5:s.q<.32;
  });
  for(let n=hs.length;n<2;n++){const s=H[n];s.seen=false;s.pinch=false;s.rp=null;s.fx.reset();s.fy.reset();s.fd.reset();}
  const b=H[0];
  tgt.x=b.x;tgt.y=b.y;tgt.d=b.d;tgt.down=b.pinch;tgt.seen=b.seen&&hs.length>0;
  const s2=H[1];
  if(s2.seen&&s2.pinch){if(s2.rp)rotateBy((s2.x-s2.rp.x)*1.2,(s2.y-s2.rp.y)*1.2);s2.rp={x:s2.x,y:s2.y};}else s2.rp=null;
  $('msg').textContent=!hs.length?'Tunjukkan tangan ke kamera'
    :tgt.down?'Tarik untuk memanjangkan, lepas untuk menaruh'
    :'Cubit jempol dan telunjuk untuk membuat balok. Tangan kedua: cubit dan geser untuk memutar';
}
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:960},height:{ideal:540},frameRate:{ideal:60,min:24}},audio:false});
  mirror=facing==='user';video.style.transform=mirror?'scaleX(-1)':'none';
  video.srcObject=stream;await video.play();video.classList.add('on');
}
$('start').onclick=async()=>{
  $('start').style.display='none';
  try{
    if(typeof Hands==='undefined')throw new Error('library hand tracking gagal dimuat (perlu internet)');
    await startCam();
    hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
    const mobile=/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
    hands.setOptions({maxNumHands:2,modelComplexity:mobile?0:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onHands);
    $('msg').textContent='Memuat model hand tracking…';
    $('flip').style.display='';
    const loop=async()=>{if(video.readyState>=2&&video.videoWidth)await hands.send({image:video});requestAnimationFrame(loop);};
    loop();
  }catch(err){
    handsOn=false;$('msg').textContent='Kamera tidak aktif: '+err.message+'. Pakai mouse/sentuh.';
  }
};
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';try{await startCam();}catch(e){$('msg').textContent='Gagal ganti kamera: '+e.message;}};

/* ---------- render ---------- */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(.001,(now-lastT)/1000));lastT=now;
  stepBuild(dt);animPreview(dt);animPop(now);inertia(dt);drawHands(dt);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
